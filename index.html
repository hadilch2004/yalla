<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF7EB3">
  <meta name="description" content="Yalla: make a plan, find your crew, meet people on campus.">
  <title>Yalla – hang out on campus</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <!-- install on iPhone: open in Safari, Share, Add to Home Screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Yalla">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="shell">
    <div id="map"></div>
    <div id="app"></div>
    <div id="sheet"></div>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/leaflet-maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
  <script>
    // lets the app work offline once it has been opened (see sw.js)
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
