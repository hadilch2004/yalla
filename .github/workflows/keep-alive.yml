# Keeps the free Supabase project from being paused for inactivity.
# Supabase pauses a free project after about a week without activity. This job talks to the
# backend every 3 days (one request to the auth service, one to the database API), using only
# the PUBLIC key already in config.js. It fails loudly if the backend does not answer, so GitHub
# emails the repository owner when the project is down or paused.
#
# GitHub switches off scheduled jobs in a public repo after 60 days without repository activity;
# the last step re-enables this workflow on every run to reset that timer.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'   # every 3rd day at 06:17 UTC
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ping the backend
        run: |
          url=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js | head -1)
          key=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" config.js | head -1)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "config.js has no Supabase URL/key"; exit 1; fi
          echo "Pinging $url"
          auth=$(curl -s -m 30 -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 "$url/auth/v1/settings" -H "apikey: $key")
          # A signed-out visitor is refused on purpose (401), which still proves the database answered.
          rest=$(curl -s -m 30 -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 "$url/rest/v1/profiles?select=id&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "auth service: $auth   database API: $rest"
          if [ "$auth" != "200" ]; then echo "Auth service did not answer: is the project paused?"; exit 1; fi
          case "$rest" in 200|401|403) ;; *) echo "Database API did not answer as expected: is the project paused?"; exit 1;; esac

      - name: Reset GitHub's 60-day inactivity timer for this workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-alive.yml --repo "${{ github.repository }}"
